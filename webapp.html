<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>PROMPT TAJ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07080c;
    --surface:#0e1118;
    --surface-2:#141926;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.14);
    --text:#e9ebf1;
    --muted:#8a92a6;
    --gold:#d8b76e;
    --gold-deep:#b68d43;
    --gold-soft:rgba(216,183,110,.12);
    --ok:#6fcf97;
    --err:#ff7a7a;
    --r:18px;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  body{min-height:100vh;
    background:
      radial-gradient(600px 320px at 50% -80px,rgba(216,183,110,.10),transparent 70%),
      var(--bg)}
  svg{display:block;flex:none}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

  /* ───────── экран загрузки ───────── */
  #splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;background:var(--bg);transition:opacity .5s ease,visibility .5s}
  #splash.hide{opacity:0;visibility:hidden}
  .ring{position:relative;width:168px;height:168px}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .track{stroke:var(--line);fill:none;stroke-width:3}
  .ring .bar{stroke:url(#g);fill:none;stroke-width:3;stroke-linecap:round;
    stroke-dasharray:452.4;stroke-dashoffset:452.4}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:40px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ring .pct small{font-size:16px;color:var(--muted);margin-left:2px;font-weight:500}
  .splash-title{font-size:13px;letter-spacing:.32em;color:var(--muted);font-weight:500;text-transform:uppercase}
  .splash-step{height:18px;font-size:13px;color:var(--gold);transition:opacity .25s}

  /* ───────── страница ───────── */
  .page{max-width:520px;margin:0 auto;padding:22px 16px calc(28px + var(--safe-b));
    opacity:0;transform:translateY(10px);transition:opacity .6s ease .1s,transform .6s ease .1s}
  .page.show{opacity:1;transform:none}

  header{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 22px}
  header i{flex:1;height:1px;max-width:64px;background:linear-gradient(90deg,transparent,var(--line-strong))}
  header i:last-child{background:linear-gradient(270deg,transparent,var(--line-strong))}
  header h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.34em;padding-left:.34em;
    background:linear-gradient(180deg,#f3e3b8,var(--gold) 55%,var(--gold-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent}

  .card{background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .card-head{display:flex;align-items:center;gap:10px;padding:13px 14px 0}
  .badge{width:30px;height:30px;border-radius:9px;background:var(--gold-soft);color:var(--gold);
    display:flex;align-items:center;justify-content:center;border:1px solid rgba(216,183,110,.18)}
  .badge svg{width:16px;height:16px}
  .label{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .grow{flex:1}

  /* совет */
  .tip{margin-bottom:14px;padding-bottom:16px}
  .tip-photo{margin:14px 14px 0;border-radius:12px;overflow:hidden;border:1px solid var(--line);
    background:var(--surface);display:none;max-height:280px}
  .tip-photo.on{display:block}
  .tip-photo img{width:100%;height:100%;max-height:280px;object-fit:cover;display:block}
  .tip p{margin:14px 16px 0;font-size:14.5px;line-height:1.6;color:#c6cad6}
  .tip p b{color:var(--text);font-weight:600}

  /* кнопка скачать */
  .btn-main{width:100%;height:54px;border-radius:15px;margin-bottom:14px;position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;gap:10px;
    font-size:15.5px;font-weight:600;letter-spacing:.01em;color:#17120a;
    background:linear-gradient(180deg,#e6c987,var(--gold) 50%,var(--gold-deep));
    box-shadow:0 10px 28px -12px rgba(216,183,110,.55),inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .15s ease,filter .2s}
  .btn-main:active{transform:scale(.985);filter:brightness(.95)}
  .btn-main svg{width:19px;height:19px}
  .btn-main[disabled]{filter:saturate(.6) brightness(.9);cursor:default}
  .spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(23,18,10,.25);border-top-color:#17120a;
    animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* промт */
  .prompt-head{padding:12px 12px 12px 14px;border-bottom:1px solid var(--line)}
  .btn-copy{display:flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:10px;
    font-size:13px;font-weight:500;color:var(--text);background:rgba(255,255,255,.05);
    border:1px solid var(--line-strong);transition:background .2s,color .2s,border-color .2s}
  .btn-copy:active{background:rgba(255,255,255,.1)}
  .btn-copy svg{width:15px;height:15px}
  .btn-copy.done{color:var(--ok);border-color:rgba(111,207,151,.4);background:rgba(111,207,151,.08)}
  .prompt-body{padding:16px;font-size:14.5px;line-height:1.7;color:#dfe2ea;white-space:pre-wrap;
    word-break:break-word;user-select:text;-webkit-user-select:text}

  footer{margin-top:22px;text-align:center;font-size:12px;color:var(--muted)}
  footer a{color:var(--gold);text-decoration:none;font-weight:500}

  .error{display:none;text-align:center;padding:46px 22px}
  .error.on{display:block}
  .error .badge{width:48px;height:48px;border-radius:14px;margin:0 auto 16px;color:var(--err);
    background:rgba(255,122,122,.09);border-color:rgba(255,122,122,.2)}
  .error .badge svg{width:22px;height:22px}
  .error h2{margin:0 0 8px;font-size:17px;font-weight:600}
  .error p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.55}
  .btn-ghost{height:44px;padding:0 20px;border-radius:12px;border:1px solid var(--line-strong);
    background:rgba(255,255,255,.04);font-size:14px;font-weight:500}

  #toast{position:fixed;left:50%;bottom:calc(26px + var(--safe-b));transform:translate(-50%,20px);opacity:0;
    display:flex;align-items:center;gap:9px;padding:11px 16px;border-radius:13px;font-size:13.5px;font-weight:500;
    background:rgba(24,29,42,.96);border:1px solid var(--line-strong);backdrop-filter:blur(10px);
    box-shadow:0 14px 40px -12px rgba(0,0,0,.7);transition:all .3s ease;pointer-events:none;z-index:60;white-space:nowrap}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  #toast svg{width:16px;height:16px;color:var(--ok)}
  #toast.bad svg{color:var(--err)}
</style>
</head>
<body>

<!-- иконки (stroke, в стиле Lucide) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1dca6"/><stop offset="1" stop-color="#b68d43"/>
    </linearGradient>
    <symbol id="i-bulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
      <path d="M9 18h6"/><path d="M10 22h4"/></symbol>
    <symbol id="i-dl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="14" height="14" x="8" y="8" rx="2.5"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 7V5h16v2"/><path d="M9 19h6"/><path d="M12 5v14"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16.5v.01"/></symbol>
  </defs>
</svg>

<!-- загрузка -->
<div id="splash">
  <div class="ring">
    <svg viewBox="0 0 160 160"><circle class="track" cx="80" cy="80" r="72"/><circle class="bar" id="bar" cx="80" cy="80" r="72"/></svg>
    <div class="pct"><span id="pct">0</span><small>%</small></div>
  </div>
  <div class="splash-title">Prompt Taj</div>
  <div class="splash-step" id="step">Подключение…</div>
</div>

<main class="page" id="page">
  <header><i></i><h1>PROMPT TAJ</h1><i></i></header>

  <div id="content" hidden>
    <section class="card tip" id="tip">
      <div class="card-head">
        <div class="badge"><svg><use href="#i-bulb"/></svg></div>
        <span class="label">Совет</span>
      </div>
      <div class="tip-photo" id="tipPhoto"><img id="tipImg" alt=""></div>
      <p id="tipText"></p>
    </section>

    <button class="btn-main" id="dl" type="button">
      <svg><use href="#i-dl"/></svg><span id="dlText">Скачать промт</span>
    </button>

    <section class="card">
      <div class="card-head prompt-head">
        <div class="badge"><svg><use href="#i-text"/></svg></div>
        <span class="label grow">Промт</span>
        <button class="btn-copy" id="copy" type="button"><svg><use href="#i-copy"/></svg><span id="copyText">Копировать</span></button>
      </div>
      <div class="prompt-body" id="prompt"></div>
    </section>

    <footer>Автор — <a href="https://t.me/IDIEVW" id="owner">@IDIEVW</a></footer>
  </div>

  <section class="error" id="error">
    <div class="badge"><svg><use href="#i-alert"/></svg></div>
    <h2 id="errTitle">Не удалось открыть промт</h2>
    <p id="errText"></p>
    <button class="btn-ghost" id="retry" type="button">Повторить</button>
  </section>
</main>

<div id="toast"><svg><use href="#i-check"/></svg><span id="toastText"></span></div>

<script>
(function(){
  const tg = window.Telegram && Telegram.WebApp;
  const $ = id => document.getElementById(id);
  const qs = new URLSearchParams(location.search);
  const DEMO = qs.get('demo') === '1';               // предпросмотр дизайна вне Telegram
  const POST = parseInt(qs.get('p') || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '0', 10);
  const initData = (tg && tg.initData) || '';

  const TIPS = {
    single: 'Загружай одновременно <b>2 фотографии</b>: свою фото, а также это фото как референс. ' +
            'Так генератору будет проще сохранить ваше лицо и повторить позу.',
    pair:   'Загружай одновременно <b>2 фотографии</b>: свою и девушки, а также это фото как референс. ' +
            'Так генератору будет проще сохранить ваши лица и повторить позу.'
  };

  if (tg) {
    try { tg.ready(); tg.expand(); } catch(e){}
    try { tg.setHeaderColor('#07080c'); tg.setBackgroundColor('#07080c'); } catch(e){}
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){}
  }
  const haptic = t => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(t); } catch(e){} };

  /* ── тост ── */
  let tt;
  function toast(text, bad){
    const el = $('toast'); $('toastText').textContent = text;
    el.classList.toggle('bad', !!bad); el.classList.add('on');
    clearTimeout(tt); tt = setTimeout(()=>el.classList.remove('on'), 2200);
  }

  /* ── загрузка в процентах ── */
  const C = 452.4;
  let shown = 0, target = 0, raf;
  const steps = [[0,'Подключение…'],[28,'Регистрация профиля…'],[58,'Подготовка промта…'],[88,'Почти готово…']];
  function paint(p){
    $('bar').style.strokeDashoffset = C * (1 - p/100);
    $('pct').textContent = Math.round(p);
    let s = steps[0][1]; steps.forEach(x => { if (p >= x[0]) s = x[1]; });
    if ($('step').textContent !== s) $('step').textContent = s;
  }
  function tick(){
    shown += (target - shown) * 0.06 + 0.12;
    if (shown > target) shown = target;
    paint(shown);
    if (shown < 100) raf = requestAnimationFrame(tick); else finishSplash();
  }
  function setTarget(t){ target = Math.max(target, t); }
  let crawl = setInterval(()=>{ if (target < 90) target += 1.4; }, 60);   // ползёт до 90, пока идёт запрос
  function finishSplash(){
    $('step').textContent = 'Готово';
    setTimeout(()=>{ $('splash').classList.add('hide'); $('page').classList.add('show'); }, 250);
  }
  raf = requestAnimationFrame(tick);

  /* ── API ── */
  async function api(path, body){
    const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(Object.assign({initData, post: POST}, body||{}))});
    let j = {}; try { j = await r.json(); } catch(e){}
    if (!r.ok || !j.ok) { const e = new Error(j.error || ('http_' + r.status)); e.code = j.error || r.status; throw e; }
    return j;
  }

  const ERRS = {
    no_claim: ['Промт ещё не получен', 'Вернитесь в бота, выполните подписки и нажмите «Получить промт» ещё раз.'],
    bad_init: ['Нужно открыть через Telegram', 'Откройте это окно кнопкой «Открыть» в чате с ботом.'],
    no_post:  ['Публикация не найдена', 'Возможно, она была удалена.'],
    default:  ['Не удалось открыть промт', 'Проверьте интернет и попробуйте ещё раз.']
  };
  function showError(code){
    const [t, d] = ERRS[code] || ERRS.default;
    $('errTitle').textContent = t; $('errText').textContent = d;
    $('content').hidden = true; $('error').classList.add('on');
  }

  async function load(){
    $('error').classList.remove('on');
    let data;
    try {
      if (DEMO) {
        await new Promise(r => setTimeout(r, 1400));
        data = {kind: qs.get('kind') === 'pair' ? 'pair' : 'single', has_photo: false,
          prompt: 'Используй приложенное фото моего лица как эталон личности: сохрани лицо, тон кожи, возраст и черты без изменений. ' +
                  'Помести этого человека в сцену: вертикальный портрет по пояс, мягкий боковой свет из окна слева, тёплая цветовая гамма, ' +
                  'глубина резкости как у объектива 85 мм, лёгкое зерно плёнки. Поза — вполоборота, взгляд в камеру, правая рука у воротника. ' +
                  'Одежда: тёмно-серое пальто из шерсти, под ним чёрная водолазка. Фон — размытая вечерняя улица с тёплыми огнями.'};
      } else {
        if (!POST) throw Object.assign(new Error('no_post'), {code:'no_post'});
        data = await api('/api/open');
      }
    } catch (e) {
      clearInterval(crawl); setTarget(100);
      setTimeout(()=>showError(e.code), 400);
      return;
    }
    $('prompt').textContent = data.prompt;
    $('tipText').innerHTML = TIPS[data.kind === 'pair' ? 'pair' : 'single'];
    $('content').hidden = false;
    clearInterval(crawl); setTarget(100);
    if (data.has_photo && !DEMO) loadPhoto();
  }

  async function loadPhoto(){
    try {
      const r = await fetch('/api/photo', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({initData, post: POST})});
      if (!r.ok) return;
      const url = URL.createObjectURL(await r.blob());
      $('tipImg').src = url; $('tipPhoto').classList.add('on');
    } catch(e){}
  }

  /* ── копировать ── */
  async function copyText(text){
    try { await navigator.clipboard.writeText(text); return true; } catch(e){}
    try {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch(e){ return false; }
  }
  $('copy').onclick = async () => {
    const ok = await copyText($('prompt').textContent);
    if (ok) {
      haptic('success'); toast('Промт скопирован');
      const b = $('copy'); b.classList.add('done');
      b.querySelector('use').setAttribute('href','#i-check'); $('copyText').textContent = 'Скопировано';
      setTimeout(()=>{ b.classList.remove('done'); b.querySelector('use').setAttribute('href','#i-copy'); $('copyText').textContent = 'Копировать'; }, 2200);
    } else { haptic('error'); toast('Не удалось скопировать', true); }
  };

  /* ── скачать: бот пришлёт промт файлом в чат ── */
  let busy = false;
  $('dl').onclick = async () => {
    if (busy) return; busy = true;
    const b = $('dl'), ico = b.querySelector('svg');
    b.disabled = true; ico.outerHTML = '<span class="spin" id="sp"></span>'; $('dlText').textContent = 'Отправляю…';
    const restore = () => {
      const sp = $('sp'); if (sp) sp.outerHTML = '<svg><use href="#i-dl"/></svg>';
      $('dlText').textContent = 'Скачать промт'; b.disabled = false; busy = false;
    };
    try {
      if (DEMO) await new Promise(r => setTimeout(r, 900)); else await api('/api/download');
      haptic('success'); toast('Промт отправлен в чат с ботом');
    } catch(e){ haptic('error'); toast('Не удалось отправить. Попробуйте ещё раз', true); }
    setTimeout(restore, 600);
  };

  $('retry').onclick = () => location.reload();
  $('owner').onclick = e => { if (tg && tg.openTelegramLink) { e.preventDefault(); tg.openTelegramLink('https://t.me/IDIEVW'); } };

  load();
})();
</script>
</body>
</html>
